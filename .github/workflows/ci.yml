name: build and tests

# The shared server CI of Snail.Sdk: the tests, the conformance check, the reference, and the server published the way a
# client starts it — dotnet and the dll — and asked over stdio. The live checks need the browser container and skip
# themselves here, saying so rather than passing. The container image is image.yml.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: orldev/Snail.Sdk/.github/workflows/mcp-ci.yml@v1
    with:
      contract-variable: SNAIL_PLAYWRIGHT_SERVER
      contract-filter: FullyQualifiedName~StdioContract
