name: build, tests and image

on:
  push:
    branches: [master, main]
    tags: ['v*']
  # On a pull request too: nothing in the solution builds the Dockerfile, so a broken one would otherwise
  # be found only after the merge.
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: s3l-playwright-mcp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # The bundled toolkit keeps one version while it is unpublished, so the cache is keyed by the
          # packages themselves: a repacked toolkit must not be served from a cache that holds the old one.
          key: nuget-${{ hashFiles('**/*.csproj', 'packages/*.nupkg') }}

      - run: dotnet restore Snail.MCP.Playwright.slnx

      - run: dotnet build Snail.MCP.Playwright.slnx -c Release --no-restore

      # The live checks need the browser container and are skipped here; they say so rather than pass.
      - name: Tests
        run: >
          dotnet test Snail.MCP.Playwright.slnx -c Release --no-build
          --logger "trx;LogFileName=tests.trx" --results-directory artifacts/tests

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test results
          path: artifacts/tests

  image:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Published on a tag only: a branch and a pull request build the image to prove that it builds.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.IMAGE }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}
